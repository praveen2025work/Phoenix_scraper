[project]
name = "phoenix-scraper"
version = "0.1.0"
description = "POC: scrape Arize Phoenix traces/spans/sessions/costs/prompts, mine frequent user prompts, and map them to a skills catalog (global / asset-class / capability levels)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
live = ["arize-phoenix-client~=2.13"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
pheonix = "phoenix_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phoenix_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
